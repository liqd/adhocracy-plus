[project]
name = "adhocracy-plus"
version = "0"
requires-python = ">=3.12,<3.13"

dependencies = [
    # A4
    "adhocracy4",

    # Additional requirements
    "brotli==1.2.1",
    "django-cloudflare-push",
    "django-guest-user",
    "django-htmx==1.29.0",
    "django-csp==4.0",
    "djangorestframework-gis==1.3.0",
    "django-parler==2.3",
    "djangorestframework-simplejwt==5.5.1",
    "sentry-sdk==2.74.0",
    "wagtail==7.4.4",
    "whitenoise==6.9.0",
    "xmltodict==0.14.2",
    "zeep==4.3.3",
    "urllib3==2.7.0",
    "redis==8.1.0",
    "pytest-testmon==2.2.0",
    "mistralai>=2.0.0,<3",
    "pydantic-ai==1.102.0",
    "json-repair>=0.39,<1",
    "pymupdf==1.27.1",
    "python-docx==1.2.0",

    # Inherited a4-core requirements
    "Django==5.2.19",
    "django-allauth[socialaccount]==65.14.1",
    "django-autoslug==1.9.9",
    "django-ckeditor-5",
    "django-filter==24.3",
    "django-widget-tweaks==1.5.1",
    "djangorestframework==3.16.0",
    "easy-thumbnails==2.10.1",
    "jsonfield==3.1.0",
    "python-magic==0.4.27",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.2",
    "rules==3.5",
    "celery==5.6.3",
    "kombu==5.7.0",
    "granian==2.8.9",
    "django-polymorphic==4.8",
]

[project.optional-dependencies]
prod = [
    "hiredis==3.5.0",
    "gunicorn==23.0.0",
    "psycopg[c]==3.2.3",
]

[dependency-groups]
dev = [
    "black==26.3.1",
    "django-debug-toolbar==4.4.6",
    "djlint==1.36.4",
    "factory-boy==3.3.3",
    "Faker==33.1.0",
    "flake8==7.1.1",
    "freezegun==1.5.5",
    "isort==5.13.2",
    "mkdocs==1.6.1",
    "mkdocstrings[python]==0.27.0",
    "psycopg[binary]==3.2.3",
    "pytest==9.0.3",
    "pytest-cov==6.0.0",
    "pytest-django==4.9.0",
    "pytest-factoryboy==2.8.1",
    "pytest-mock==3.14.0",
    "pytest-xdist==3.8.0",
    "pytest-playwright==0.9.0",
    "playwright==1.62.0",
    "coveralls==4.1.0",
]

[tool.uv]
package = false
required-version = ">=0.13,<0.14"
# dev installs psycopg[binary], prod psycopg[c]; both cannot be active together.
conflicts = [[{ group = "dev" }, { extra = "prod" }]]

[tool.uv.sources]
adhocracy4 = { git = "https://github.com/liqd/adhocracy4.git", rev = "main" }
django-cloudflare-push = { git = "https://github.com/skorokithakis/django-cloudflare-push.git", rev = "fcfcfc57826ecb87b9f138fd882cfb361047d850" }
django-guest-user = { git = "https://github.com/liqd/django-guest-user.git", rev = "00e250018ccd4ee848e01eaa0f6b2c6882ebc22c" }
django-ckeditor-5 = { url = "https://github.com/liqd/django-ckeditor-5/releases/download/v0.2.12-liqd/django_ckeditor_5-0.2.12-py3-none-any.whl" }
