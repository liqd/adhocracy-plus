name: opencode review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    if: |
      contains(github.event.comment.body, '//review') &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select review level
        id: level
        shell: bash
        env:
          LEVEL: ${{ vars.OPENCODE_REVIEW_LEVEL }}
          PROMPT_LIGHT: |
            Review this pull request as a senior engineer. Be brief.
            Only report clear bugs, security problems and missing database migrations.
            Use file:line references and skip stylistic suggestions.
          PROMPT_STANDARD: |
            Review this pull request as a senior engineer for the adhocracy-plus
            Django project. Focus on:
            - Correctness and potential bugs
            - Security issues (Django/Python and JavaScript)
            - Adherence to the conventions in AGENTS.md (English comments and identifiers)
            - Missing tests or database migrations
            - Performance and maintainability
            Post a concise review comment with concrete, actionable findings and
            file:line references. If there are no significant issues, say so briefly.
          PROMPT_THOROUGH: |
            Review this pull request as a senior engineer for the adhocracy-plus
            Django project. Be thorough and analyse:
            - Correctness and potential bugs, including edge cases
            - Security issues (Django/Python and JavaScript)
            - Adherence to the conventions in AGENTS.md
            - Missing tests or database migrations
            - Performance, maintainability and backwards compatibility
            - API or UX regressions
            Report every finding with a severity, a concrete suggestion and
            file:line references. Also note what looks good.
          PROMPT_COMMON: |
            Post every concrete finding as an inline review comment on the
            changed line, so it appears next to the code. Use the GitHub CLI
            (GITHUB_TOKEN is already exported and has write access):

            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              /repos/${{ github.repository }}/pulls/${{ github.event.issue.number || github.event.pull_request.number }}/comments \
              -f body="<your finding>" \
              -f commit_id="$(git rev-parse HEAD)" \
              -f path="<path/to/file>" \
              -F line=<line number> \
              -f side=RIGHT

            Rules for inline comments:
            - Only comment on lines that are part of the pull request diff
              (RIGHT side); otherwise GitHub rejects the request.
            - Keep each comment short and actionable. Do not post generic praise.
            - If a finding cannot be attached to a changed line, mention it in
              the summary instead of forcing an inline comment.

            After the inline comments, always post a short general review
            comment (your final message) and end it with this section:

            ## PM-Einschätzung
            <exactly one sentence stating whether this pull request can be
            merged as-is or not, and the main reason>
        run: |
          level="${LEVEL:-standard}"
          case "$level" in
            light) prompt="$PROMPT_LIGHT" ;;
            thorough) prompt="$PROMPT_THOROUGH" ;;
            *) level="standard"; prompt="$PROMPT_STANDARD" ;;
          esac
          prompt="$prompt

          $PROMPT_COMMON"
          {
            echo "level=$level"
            echo "prompt<<OPENCODE_PROMPT"
            echo "$prompt"
            echo "OPENCODE_PROMPT"
          } >> "$GITHUB_OUTPUT"
      - name: Run OpenCode review
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_CONFIG_CONTENT: |
            {
              "$schema": "https://opencode.ai/config.json",
              "default_agent": "review",
              "agent": {
                "review": {
                  "description": "Read-only pull request reviewer",
                  "mode": "primary",
                  "permission": {
                    "edit": "deny",
                    "read": {
                      "*": "allow",
                      "**/.git/config": "deny"
                    },
                    "external_directory": {
                      "*": "allow",
                      "/proc/**": "deny",
                      "**/.ssh/**": "deny",
                      "**/.aws/**": "deny",
                      "**/.config/**": "deny",
                      "**/.env*": "deny"
                    },
                    "bash": {
                      "*": "deny",
                      "git diff*": "allow",
                      "git log*": "allow",
                      "git show*": "allow",
                      "git status*": "allow",
                      "git rev-parse*": "allow",
                      "gh api*": "allow"
                    }
                  }
                }
              }
            }
        with:
          model: ${{ vars.OPENCODE_MODEL || 'opencode-go/mimo-v2.6-flash' }}
          variant: ${{ vars.OPENCODE_VARIANT || 'low' }}
          use_github_token: true
          mentions: //review
          prompt: ${{ steps.level.outputs.prompt }}
