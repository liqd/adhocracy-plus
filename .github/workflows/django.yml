name: Django CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    # Use your self-built image as container for the entire job
    container: ghcr.io/${{ github.repository }}/ci-base:latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Start PostgreSQL
        run: |
          sudo service postgresql start
      
      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache uv packages
        uses: actions/cache@v4
        env:
          cache-name: cache-uv-packages
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/requirements/dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Cache testmon data
        id: cache-testmon
        uses: actions/cache@v4
        with:
          path: .testmondata
          key: ${{ runner.os }}-testmon-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/requirements/dev.txt', 'adhocracy-plus/config/settings/*.py', 'pytest.ini') }}
          restore-keys: |
            ${{ runner.os }}-testmon-${{ steps.setup-python.outputs.python-version }}-

      - name: Checks
        run: |
          echo "testmon cache hit: ${{ steps.cache-testmon.outputs.cache-hit }}"
          ls -la .testmondata || true
          ./scripts/a4-check.sh

      - name: Install Python Dependencies
        run: |
          uv pip install -r requirements/dev.txt --system

      - name: Run Tests
        env:
          PGPASSWORD: postgres
          PGHOSTADDR: 127.0.0.1
        run: |
          python manage.py collectstatic > /dev/null
          isort --diff -c adhocracy-plus tests
          python manage.py makemigrations --dry-run --check --noinput
          flake8 adhocracy-plus tests --exclude migrations,settings
          
          if [ "${{ github.event_name }}" = "push" ]; then
            # Run all tests and update testmon cache for future PRs
            # Delete .testmondata to force running all tests, but still update cache
            rm -f .testmondata .testmondata-wal .testmondata-shm
            py.test --ds=adhocracy-plus.config.settings.travis --testmon --cov -n auto
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # Use testmon to run only changed tests
            py.test --ds=adhocracy-plus.config.settings.travis --testmon --cov -n auto
          fi
          if [ -f .testmondata ]; then
            python -c "import sqlite3; c=sqlite3.connect('.testmondata'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()"
          fi

      - name: Coveralls
        continue-on-error: true
        env:
          COVERALLS_SERVICE_NAME: github-actions
          GITHUB_TOKEN: ${{ secrets.COV }}
        run: |
          git config --global --add safe.directory /__w/adhocracy-plus/adhocracy-plus
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          coveralls

      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Build
        run: |
          pnpm run build

      - name: Run Frontend Tests
        run: |
          pnpm test
          pnpm run lint

      - name: Deploy
        if: github.ref == 'refs/heads/main'
        env:
          TRAVIS_SSH_SECRET: ${{ secrets.DEPLOY }}
        run: |
          ./scripts/deploy.sh

  e2e:
    runs-on: ubuntu-24.04
    # The official Playwright Python image bakes in Chromium and its OS deps;
    # the playwright pin in requirements/dev.txt must match this tag
    # (the tag includes the build number, hence the check script ignores it).
    container: mcr.microsoft.com/playwright/python:v1.62.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install System Dependencies
        run: |
          apt-get update && apt-get install -y gdal-bin libsqlite3-mod-spatialite libmagic1
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          cp "$HOME/.local/bin/uv" /usr/local/bin/uv
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Cache uv packages
        uses: actions/cache@v4
        env:
          cache-name: cache-uv-packages
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-e2e-${{ env.cache-name }}-${{ hashFiles('**/requirements/dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-e2e-${{ env.cache-name }}-
            ${{ runner.os }}-e2e-
      - name: Install Python Dependencies
        run: |
          uv pip install -r requirements/dev.txt --system
      - name: Install Frontend Dependencies
        run: |
          pnpm install --frozen-lockfile
      - name: Build Frontend
        run: |
          pnpm run build
      - name: Run End-to-End Tests
        env:
          DJANGO_ALLOW_ASYNC_UNSAFE: "1"
        run: |
          python manage.py collectstatic > /dev/null
          py.test -m e2e -n auto --ds=adhocracy-plus.config.settings.e2e \
            --tracing retain-on-failure --screenshot only-on-failure
      - name: Upload Playwright Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
