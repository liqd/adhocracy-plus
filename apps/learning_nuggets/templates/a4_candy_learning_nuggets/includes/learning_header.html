{% load i18n %}
{% translate 'Learning Center' as learning_center_title %}
<div class="learning-header">
    <div class="learning-header__top">
        <i class="fa fa-question-circle" aria-hidden="true"></i>
        {% if is_sidebar %}
            <h2 class="learning-header__title learning-content__title learning-content__title--md">
                {{ learning_center_title }}
            </h2>
        {% else %}
            <h1 class="learning-header__title learning-content__title learning-content__title--md">
                {{ learning_center_title }}
            </h1>
        {% endif %}
    </div>
</div>
