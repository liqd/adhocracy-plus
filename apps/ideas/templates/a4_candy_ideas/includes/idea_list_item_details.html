{% load wagtailcore_tags thumbnail %}
{% if object.image %}
    <img class="item-detail__image list-item__details-image" src="{% thumbnail object.image 'idea_image' %}" alt="">
{% endif %}
<div class="ck-content">
    {% if max_chars %}
        {{ object.description | richtext | truncatechars_html:max_chars }}
    {% else %}
        {{ object.description | richtext }}
    {% endif %}
</div>
