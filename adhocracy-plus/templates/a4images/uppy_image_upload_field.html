{% load i18n %}

<div class="uppy-image-upload-field{% if dropzone %} uppy-image-upload-field--dropzone{% endif %}">
    {% if dropzone %}
    <span class="form-label" id="{{ field.id_for_label }}-label">
        {{ field.label }}{% if field.field.required %}<span role="presentation" title="{% translate 'This field is required' %}">*</span>{% endif %}
    </span>
    {{ field }}
    <button
        type="button"
        class="uppy-image-upload-field__trigger"
        data-uppy-trigger
        aria-labelledby="{{ field.id_for_label }}-label"
    >
        <i class="fas fa-arrow-up-from-bracket" aria-hidden="true"></i>
        <span class="uppy-image-upload-field__text">{% translate "Drop files here or" %} <span class="uppy-image-upload-field__browse">{% translate "browse files" %}</span></span>
        <span class="uppy-image-upload-field__note">{% translate "Images are resized and compressed automatically before you save the form." %}</span>
        <span class="uppy-image-upload-field__change">{% translate "Change image" %}</span>
    </button>
    {% if field.errors %}
        <div class="errorlist" role="alert">{{ field.errors }}</div>
    {% endif %}
    {% else %}
    {% include form_field_template with field=field %}
    <button
        type="button"
        class="btn btn--default upload-wrapper__action uppy-image-upload-field__trigger"
        data-uppy-trigger
    >
        <i class="fas fa-cloud-upload-alt" aria-hidden="true"></i>
        <span class="visually-hidden">{% translate "Upload a picture" %}</span>
    </button>
    {% endif %}
    <div
        data-uppy-image-upload
        data-input-id="{{ field.id_for_label }}"
        data-note="{% translate 'Images are resized and compressed automatically before you save the form.' %}"
        {% if aspect_ratio %}data-aspect-ratio="{{ aspect_ratio }}"{% endif %}
        {% if output_width %}data-output-width="{{ output_width }}"{% endif %}
        {% if output_height %}data-output-height="{{ output_height }}"{% endif %}
        {% if max_width %}data-max-width="{{ max_width }}"{% endif %}
        {% if max_height %}data-max-height="{{ max_height }}"{% endif %}
        hidden
    ></div>
</div>
